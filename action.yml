name: 'NRF Connect SDK CI action'
description: 'Building nrf connect sdk projects'
branding:
  color: blue
  icon: link
inputs:
  board:  # id of input
    description: 'Board for build'
    required: true
  build_dir:
    description: 'Building directory'
    required: false
    default: 'build'
  workspace_dir:
    description: 'Name of the workspace directory where the project-builds will be placed'
    required: false
    default: 'workspace'
  project_root:
    description: 'Root Directory where the project files are located'
    required: false
    default: '/github/workspace'
  file_suffix:
    description: 'Configuration file suffix'
    required: false
    default: 'release'
runs:
  using: 'docker'
  image: 'docker://ghcr.io/metax-sensors/nrf-connect-sdk-ci:v3.4.2'
  args:
    # build.sh takes 6 positional arguments, in this exact order:
    #   PROJECT_PATH BOARD BUILD_DIR FILE_SUFFIX WORKSPACE_DIR NCS_PATH
    - sh
    - ./build.sh
    - ${{ inputs.project_root }}
    - ${{ inputs.board }}
    - ${{ inputs.build_dir }}
    - ${{ inputs.file_suffix }}
    - ${{ inputs.workspace_dir }}
    - /workdir/ncs
